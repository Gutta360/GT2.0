spring:
  application:
    name: gt2-backend
  datasource:
    url: ${GT2_DB_URL}
    username: ${GT2_DB_USERNAME}
    password: ${GT2_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      datetime:
        write-dates-as-timestamps: false

server:
  address: ${GT2_SERVER_ADDRESS:127.0.0.1}
  port: ${GT2_SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

gt2:
  admin-token: ${GT2_ADMIN_TOKEN}
  snapshot-master-key: ${GT2_SNAPSHOT_MASTER_KEY}
  snapshot-storage: ${GT2_SNAPSHOT_STORAGE:./data/snapshots}
  allowed-origins: ${GT2_ALLOWED_ORIGINS:https://localhost}
  enrollment-ttl: ${GT2_ENROLLMENT_TTL:PT30M}
  max-batch-size: ${GT2_MAX_BATCH_SIZE:100}
  max-snapshot-bytes: ${GT2_MAX_SNAPSHOT_BYTES:10485760}
  snapshot-retention-count: ${GT2_SNAPSHOT_RETENTION_COUNT:5}

logging:
  level:
    root: INFO
    com.gt: INFO
    org.hibernate.SQL: WARN
